<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stipra import browser smoke</title></head>
<body>
  <output id="out">BROWSER_SMOKE_PENDING</output>
  <iframe id="studio" src="index.html" title="Import studio" width="900" height="700"></iframe>
  <script>
    (async () => {
      const wait = ms => new Promise(r => setTimeout(r, ms));
      async function until(ok, label) {
        for (let i=0; i<120; i++) {
          if (ok()) return;
          await wait(60);
        }
        throw Error('Timed out: ' + label);
      }
      const iframe=document.getElementById('studio');
      await until(()=>iframe.contentDocument?.getElementById('file') && iframe.contentDocument?.getElementById('drop'), 'studio controls loaded');
      const doc=iframe.contentDocument;
      const d=id=>doc.getElementById(id);
      function drop(file) {
        const data=new DataTransfer();
        data.items.add(file);
        d('drop').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:data}));
      }
      try {
        const safe='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="10" viewBox="0 0 40 20"><rect width="40" height="20" fill="#228da3"/></svg>';
        drop(new File([safe],'valid.svg',{type:'image/svg+xml'}));
        await until(()=>d('status').textContent.includes('SVG · 20 × 10 px'), 'safe SVG drag/drop');
        const view=d('result').querySelector('canvas');
        if(!view || view.width!==20 || view.height!==10)throw Error('SVG preview grid changed');
        if(d('actions').hidden || !d('error').hidden)throw Error('SVG preview incorrectly rejected');

        // Check real browser PNG decoding, including alpha, via the file picker event.
        const fixture=document.createElement('canvas');
        fixture.width=3;fixture.height=2;
        const fc=fixture.getContext('2d');
        fc.clearRect(0,0,3,2);
        fc.fillStyle='#fa4032';fc.fillRect(0,0,1,1);
        const blob=await new Promise(resolve=>fixture.toBlob(resolve,'image/png'));
        if(!blob)throw Error('PNG fixture encode failed');
        const png=new File([blob],'transparent.png',{type:'image/png'});
        const dt=new DataTransfer();dt.items.add(png);
        Object.defineProperty(d('file'),'files',{configurable:true,value:dt.files});
        d('file').dispatchEvent(new Event('change',{bubbles:true}));
        await until(()=>d('status').textContent.includes('PNG · 3 × 2 px'), 'PNG file input');
        const canvas=d('result').querySelector('canvas');
        if(!canvas || canvas.width!==3 || canvas.height!==2)throw Error('PNG layout changed');
        const pixels=canvas.getContext('2d').getImageData(0,0,3,2).data;
        if(pixels[3]!==255||pixels[(1*3+1)*4+3]!==0)throw Error('PNG alpha not preserved');

        // Unsupported SVG is rejected without replacing an accepted preview.
        drop(new File(['<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><script>alert(1)</scr'+'ipt></svg>'],'malicious.svg',{type:'image/svg+xml'}));
        await until(()=>!d('error').hidden, 'unsafe SVG rejection');
        if(!d('error').textContent.includes('unsupported element <script>'))throw Error('Missing SVG error description');
        if(d('result').querySelector('canvas')!==canvas)throw Error('Rejected SVG replaced accepted artwork');

        document.body.dataset.smoke='pass';
        document.getElementById('out').textContent='BROWSER_SMOKE_PASS';
      } catch(err) {
        document.body.dataset.smoke='fail';
        document.getElementById('out').textContent='BROWSER_SMOKE_FAIL: '+err.message;
      }
    })().catch(e=>{document.body.dataset.smoke='fail';document.getElementById('out').textContent='BROWSER_SMOKE_FAIL: '+e.message;});
  </script>
</body>
</html>
