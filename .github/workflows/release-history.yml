name: Record published Stiprā release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Append publication to product history
        run: node scripts/sync-release-history.js "$GITHUB_EVENT_PATH"
      - name: Validate recorded release and render contract
        run: node --test tests/roadmap-history.test.js
      - name: Commit source-of-truth update
        run: |
          git diff --quiet -- docs/data/product-history.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/product-history.json
          git commit -m "docs: record published release ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
