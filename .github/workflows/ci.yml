name: Verify Stipra
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check examples/prehnite-v8/src/font-atlas.js
      - run: node --check examples/prehnite-v8/src/engine.js
      - run: node --check examples/prehnite-v8/app.js
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:paper-mono
      - run: node --check scripts/generate-stipra-mark.js
      - run: node --check src/core.js
      - run: node --check src/separation.js
      - run: node --check src/screening.js
      - run: node --check src/styles.js
      - run: node --check src/plate-diagnostics.js
      - run: node --check bin/separate.js
      - run: node --check bin/package.js
      - run: node --check src/print-package.js
      - run: node --check src/report-paper.js
      - run: node --check src/report-layout.js
      - run: node --check src/import/svg.js
      - run: node --check src/import/probe.js
      - run: node --check src/import/asset.js
      - run: node --check src/import/node.js
      - run: node --check bin/import.js
      - run: node --check examples/import-studio/app.js
      - run: node --check bin/scene.js
      - run: node --check bin/stipra.js
      - run: node --check web/stipra/app.js
      - run: node --check scripts/cache-paper-mono.js
      - run: node --check scripts/build-type-specimens.js
      - run: npm run build:pages
      - run: node --test tests/type-proofs.test.js
      - run: npm test
      - run: npm run audit:licenses
      - run: npm run check:release:browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-export-distribution
          path: out/browser-distribution/
      - run: npm run check:release:lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-release-gates
          path: out/release-gates/
      - run: npm run check:goldens
      - uses: actions/upload-artifact@v4
        with:
          name: procedural-acceptance-goldens
          path: out/acceptance-goldens/
      - uses: actions/upload-artifact@v4
        with:
          name: lean-distribution-audit
          path: out/distribution-audit/
      - uses: actions/upload-artifact@v4
        with:
          name: core-package-report
          path: out/core-package/
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-package-report
          path: out/canvas-package/
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: out/license-audit/
      - run: node scripts/browser-smoke.js
      - run: npm run check:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-acceptance
          path: out/accessibility/
      - run: STIPRA_SMOKE_PAGE=examples/core/browser-smoke.html STIPRA_SMOKE_EXPECT=BROWSER_CORE_PASS node scripts/browser-smoke.js
      - run: STIPRA_SMOKE_PAGE=examples/sketches/browser-smoke.html STIPRA_SMOKE_EXPECT=BROWSER_SKETCH_PASS node scripts/browser-smoke.js
      - run: STIPRA_SMOKE_PAGE=web/stipra/browser-smoke.html STIPRA_SMOKE_EXPECT=BROWSER_SEPARATION_PASS node scripts/browser-smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-workflow-and-site-review
          path: out/workflow-validation/
      - run: npm run benchmark:alpha
      - run: npm run check:alpha
      - run: npm run check:regions
      - run: npm run check:exports
      - run: node scripts/physical-print-kit.js out/operator-print-kit
      - uses: actions/upload-artifact@v4
        with:
          name: operator-print-kit
          path: out/operator-print-kit/
      - run: npm run check:export-parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-export-workflow-evidence
          path: out/export-workflow/
      - run: python3 scripts/setup-provenance-tool.py .cache/c2patool
      - run: C2PATOOL="$PWD/.cache/c2patool" npm run check:provenance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-input-evidence
          path: out/structured-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-coding-alpha-evidence
          path: out/alpha-validation/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/type-comparison-requirements.txt
      - run: python scripts/verify-color-reference.py
      - run: python -m unittest discover -s tests -p type_comparison_test.py -v
      - name: Install reconstruction metric test dependencies
        run: python -m pip install -r examples/reconstruction-study/requirements-test.txt
      - name: Verify reconstruction metric and replay semantics
        run: python examples/reconstruction-study/test_metrics.py
      - run: python -m pip install zxing-cpp==2.3.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/review-qr.js /tmp/stipra-qr-review
      - run: python scripts/verify-qr.py /tmp/stipra-qr-review
      - name: Record Studio candidate identity
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const root='dist/stipra',files=[];
          function walk(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name))){
              const file=path.join(dir,entry.name);
              if(entry.isSymbolicLink())throw Error('Candidate contains a symlink: '+file);
              if(entry.isDirectory())walk(file);
              else if(entry.isFile()){
                const bytes=fs.readFileSync(file);
                files.push({path:path.relative(root,file).split(path.sep).join('/'),bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});
              }else throw Error('Unsupported candidate entry: '+file);
            }
          }
          walk(root);
          if(!files.length)throw Error('Empty Studio candidate');
          const manifest={contract:'stipra-studio-candidate-v1',target:'v0.9-rc.1',status:'experimental-digital-candidate',sourceRevision:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT,files};
          fs.writeFileSync(path.join(root,'candidate.json'),JSON.stringify(manifest,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: studio-browser-candidate-${{ github.sha }}
          path: dist/stipra/
          if-no-files-found: error
          retention-days: 30
