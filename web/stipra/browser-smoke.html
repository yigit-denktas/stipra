<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stipra image separation browser smoke</title></head>
<body><output id="out">BROWSER_SEPARATION_PENDING</output><iframe id="studio" src="/dist/stipra/index.html" width="900" height="600"></iframe>
<script src="../../node_modules/jszip/dist/jszip.min.js"></script>
<script src="../../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
<script>
(async()=>{
  const delay=t=>new Promise(resolve=>setTimeout(resolve,t));
  async function until(predicate,label){
    for(let k=0;k<450;k++){if(predicate())return;await delay(60);}
    throw Error('Timed out '+label);
  }
  const frame=document.getElementById('studio');
  const output=document.getElementById('out');
  let d;
  try{
    await until(()=>frame.contentDocument?.documentElement?.dataset.stipraReady==='true','lab script loading');
    d=frame.contentDocument;await d.fonts.ready;
    const el=id=>d.getElementById(id);
    const boundaryCases=await (await fetch('/tests/fixtures/png-boundaries.json')).json(),importWindow=frame.contentWindow;
    for(const name of ['apng','pq','hlg','displayP3','mastering','lightLevel','rotatedExif','invalidDepth','combinedSignals']){
      const bytes=new importWindow.Uint8Array(Uint8Array.from(atob(boundaryCases[name]),c=>c.charCodeAt(0)));let rejected=false;
      try{importWindow.StipraImportProbe.inspect(bytes);}catch{rejected=true;}
      if(!rejected)throw Error('Browser accepted unsupported PNG '+name);
    }
    const precision=await importWindow.StipraImport.ingest(new importWindow.Uint8Array(Uint8Array.from(atob(boundaryCases.sdr16),c=>c.charCodeAt(0))),{
      canvas:(w,h)=>{const c=d.createElement('canvas');c.width=w;c.height=h;return c;},
      decode:async(bytes,type)=>createImageBitmap(new Blob([bytes],{type})),
    });
    if(precision.metadata.sourceEncoding.bitDepth!==16||precision.metadata.pixels.bitDepth!==8||precision.rgba.length!==8||!precision.metadata.warnings.some(x=>x.includes('16-bit')))throw Error('Browser precision declaration missing');

    const colorFixture=await (await fetch('/tests/fixtures/color-reference.json')).json();
    for(const [name,reference] of [['linear','reference'],['linear-jpeg','jpeg-reference']]){
      const decode=value=>Uint8Array.from(atob(colorFixture.files[value]),c=>c.charCodeAt(0));
      const bitmap=async value=>createImageBitmap(new Blob([decode(value)]));
      const expectedCanvas=document.createElement('canvas');expectedCanvas.width=96;expectedCanvas.height=16;
      expectedCanvas.getContext('2d',{colorSpace:'srgb'}).drawImage(await bitmap(reference),0,0);
      const referencePixels=expectedCanvas.getContext('2d').getImageData(0,0,96,16,{colorSpace:'srgb'}).data;
      const colorTransfer=new DataTransfer();colorTransfer.items.add(new File([decode(name)],name+'.'+(name.includes('jpeg')?'jpg':'png')));
      el('drop').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:colorTransfer}));
      await until(()=>el('status').textContent.includes('96 × 16 px'),'profiled source '+name);
      const actual=d.querySelector('#grid canvas').getContext('2d').getImageData(0,0,96,16,{colorSpace:'srgb'}).data;
      for(const [x,y] of colorFixture.sampleCoordinates)for(let c=0;c<3;c++){
        const offset=(y*96+x)*4+c;
        if(Math.abs(actual[offset]-referencePixels[offset])>colorFixture.tolerance8bit)throw Error('Browser ICC reference mismatch: '+name);
      }
      if(actual[(8*96+8)*4]<90)throw Error('Browser ignored non-sRGB profile');
    }
    const input=document.createElement('canvas');input.width=4;input.height=2;
    const ctx=input.getContext('2d');
    ctx.clearRect(0,0,4,2);
    ctx.fillStyle='#e65e4b';ctx.fillRect(1,0,1,1);
    ctx.fillStyle='#000000';ctx.fillRect(2,0,1,1);
    const blob=await new Promise(resolve=>input.toBlob(resolve,'image/png'));
    const transfer=new DataTransfer();transfer.items.add(new File([blob],'test.png',{type:'image/png'}));
    el('drop').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));
    await until(()=>el('status').textContent.includes('SPOT · 4 × 2 px'),'spot PNG separation');
    const canvases=()=>[...d.querySelectorAll('#grid canvas')];
    if(canvases().length!==4)throw Error('spot requires source, composite and exactly two masks');
    const grey=(c,x,y)=>c.getContext('2d').getImageData(x,y,1,1).data[0];
    const original=canvases()[0],blue=canvases()[2],coral=canvases()[3];
    if(original.width!==4||original.height!==2||coral.width!==4||blue.width!==4)
      throw Error('source or mask canvas dimension mismatch');
    if(grey(coral,1,0)!==0)throw Error('target matched spot ink is not fully covered');
    if(grey(coral,0,0)!==255)throw Error('transparent source produced ink');
    async function adjustFromPlate(id){
      const box=el('ink-settings-'+id),button=d.querySelector('#plates button[aria-controls="ink-settings-'+id+'"]');
      if(!box||!button)throw Error('Plate adjustment target missing '+id);
      const before=canvases().map(c=>Array.from(c.getContext('2d').getImageData(0,0,c.width,c.height).data));
      const wasOpen=box.open;box.open=false;button.focus();button.click();
      if(!box.open||d.activeElement!==box.querySelector('summary'))throw Error('Plate adjustment lost disclosure/focus '+id);
      await until(()=>{const r=box.querySelector('summary').getBoundingClientRect();return r.top>=-1&&r.bottom<=frame.contentWindow.innerHeight+1;},'ink summary scrolled into view '+id);
      if(canvases().some((c,n)=>{const after=c.getContext('2d').getImageData(0,0,c.width,c.height).data;return !before[n].every((v,i)=>v===after[i]);}))throw Error('Plate navigation changed artwork '+id);
      box.open=wasOpen;
    }
    await adjustFromPlate('coral');
    const strength=el('control-coral-Strength');
    if(!strength)throw Error('coral gain control absent');
    strength.value='0.4';
    strength.dispatchEvent(new Event('input',{bubbles:true}));
    await until(()=>grey(canvases()[3],1,0)>120,'real mask coverage edit');
    if(canvases()[3].width!==4)throw Error('mask canvas changed position or width');

    const full=Array.from(canvases()[1].getContext('2d').getImageData(0,0,4,2).data);
    el('solo-blue').click();
    if(el('solo-blue').getAttribute('aria-pressed')!=='true'||d.activeElement!==el('solo-blue'))throw Error('Solo button lost keyboard focus/state');
    el('reset-inspection').click();
    if(!full.every((v,i)=>v===canvases()[1].getContext('2d').getImageData(0,0,4,2).data[i]))throw Error('Reset did not restore full proof');
    el('proof-paper').checked=false;el('proof-paper').dispatchEvent(new Event('change'));
    if(canvases()[1].getContext('2d').getImageData(0,0,1,1).data[3]!==0)throw Error('Paper toggle did not expose empty source');
    el('proof-paper').checked=true;el('proof-paper').dispatchEvent(new Event('change'));
    el('paper-only').checked=true;el('paper-only').dispatchEvent(new Event('change'));
    const stock=canvases()[1].getContext('2d').getImageData(0,0,4,2).data;
    if(stock[0]!==stock[4]||stock[1]!==stock[5])throw Error('Paper-only view contains ink');
    el('reset-inspection').click();
    el('view-zoom').value='native';el('view-zoom').dispatchEvent(new Event('change'));
    if(!el('grid').classList.contains('native-pixels'))throw Error('Native pixel view unavailable');
    el('view-zoom').value='fit';el('view-zoom').dispatchEvent(new Event('change'));
    el('ink-count').value='8';el('ink-count').dispatchEvent(new Event('change'));
    if(canvases().length!==10||el('plate-count').textContent!=='8 ink plates')throw Error('Manual eight-ink setup failed');
    for(const box of d.querySelectorAll('#inks details.ink'))await adjustFromPlate(box.dataset.ink);
    el('ink-count').value='2';el('ink-count').dispatchEvent(new Event('change'));
    if(canvases().length!==4||!el('print-geometry').textContent.includes('origin 0,0'))throw Error('Ink count/frame controls failed');
    el('mode').value='cmyk';
    el('mode').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>el('status').textContent.includes('CMYK · 4 × 2 px'),'CMYK mode');
    if(canvases().length!==6)throw Error('CMYK requires 4 physical ink plates');
    for(const box of d.querySelectorAll('#inks details.ink'))await adjustFromPlate(box.dataset.ink);
    if(grey(canvases()[5],2,0)!==0)throw Error('solid black did not route to K');
    if(grey(canvases()[2],0,0)!==255)throw Error('transparent pixel routed to cyan');
    if(el('error').hidden!==true)throw Error('unreported separation UI error: '+el('error').textContent);

    // End-to-end browser check that screening edits *the actual plate data*.
    el('mode').value='spot';
    el('mode').dispatchEvent(new Event('change',{bubbles:true}));
    const illustration=document.createElement('canvas');
    illustration.width=48;illustration.height=32;
    const painter=illustration.getContext('2d');
    painter.fillStyle='#999999';painter.fillRect(0,0,48,32);
    painter.fillStyle='#e65e4b';painter.fillRect(24,0,12,32);
    painter.fillStyle='#0d4dad';painter.beginPath();painter.arc(16,16,11,0,Math.PI*2);painter.fill();
    painter.fillStyle='#ffffff';painter.beginPath();painter.moveTo(9,8);painter.lineTo(23,16);painter.lineTo(9,24);painter.closePath();painter.fill();
    painter.clearRect(40,4,4,24);
    const screeningBlob=await new Promise(resolve=>illustration.toBlob(resolve,'image/png'));
    const screeningTransfer=new DataTransfer();
    screeningTransfer.items.add(new File([screeningBlob],'screening.png',{type:'image/png'}));
    el('drop').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:screeningTransfer}));
    await until(()=>el('status').textContent.includes('SPOT · 48 × 32 px'),'screening source loaded');
    const baseline=Array.from(canvases()[2].getContext('2d').getImageData(0,0,48,32).data);
    el('screen-mode').value='dots';el('screen-mode').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>canvases()[2].width===48 && baseline.some((v,i)=>v!==canvases()[2].getContext('2d').getImageData(0,0,48,32).data[i]),
      'real screen raster mask changed');
    const dotted=Array.from(canvases()[2].getContext('2d').getImageData(0,0,48,32).data);
    if(!dotted.some((v,i)=>v!==baseline[i]))throw Error('Dots do not affect actual grayscale coverage');
    if(!el('screen-dot-scale')||!el('screen-solid-threshold')||!el('screen-blue-pitch'))throw Error('Supported screen settings inaccessible');
    el('screen-blue-dotScale').value='0.6';el('screen-blue-dotScale').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>dotted.some((v,i)=>v!==canvases()[2].getContext('2d').getImageData(0,0,48,32).data[i]),'mark scale changed actual coverage');
    el('screen-blue-dotScale').value='1';el('screen-blue-dotScale').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>dotted.every((v,i)=>v===canvases()[2].getContext('2d').getImageData(0,0,48,32).data[i]),'mark scale repeatability');
    el('screen-blue-x').value='4';
    el('screen-blue-x').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>dotted.some((v,i)=>v!==canvases()[2].getContext('2d').getImageData(0,0,48,32).data[i]),
      'per-ink registration shifted plate');
    if(canvases().some(c=>c.width!==48||c.height!==32))throw Error('Screening changed plate layout');

    // Layout regression: real screen geometry must not overflow or overlap, including
    // the original 1339px screenshot width where the sidebar covered the artwork.
    for(const width of [390,768,1024,1339,1440]){
      frame.style.width=width+'px';frame.style.height='850px';
      await delay(80);
      const doc=frame.contentDocument,win=frame.contentWindow;
      const view=doc.documentElement,art=doc.querySelector('.workspace'),
        panel=doc.querySelector('#inspector'),hero=doc.getElementById('hero'),
        plates=doc.getElementById('plates');
      const ar=art.getBoundingClientRect(),pr=panel.getBoundingClientRect(),
        hr=hero.getBoundingClientRect(),pl=plates.getBoundingClientRect();
      if(view.scrollWidth>view.clientWidth+2)
        throw Error('Horizontal page overflow at '+width+'px: '+view.scrollWidth+' > '+view.clientWidth);
      if(width>1000 && ar.right>pr.left-8)
        throw Error('Inspector overlaps artwork at '+width+'px');
      if(width<=1000 && pr.top<ar.bottom-4)
        throw Error('Mobile inspector overlaps artwork at '+width+'px');
      if(pl.top<hr.bottom-4)throw Error('Ink plates overlap main previews at '+width+'px');
      await adjustFromPlate('coral');
      if([...plates.querySelectorAll('.plate-adjust')].some(b=>b.getBoundingClientRect().height<44))throw Error('Plate adjustment touch target too small at '+width);
      const previews=hero.querySelectorAll('canvas');
      if(previews.length!==2||plates.querySelectorAll('canvas').length!==2)
        throw Error('Gallery lost source or plates at '+width+'px');
      if([...doc.querySelectorAll('#grid canvas')].some(c=>c.getBoundingClientRect().width>art.getBoundingClientRect().width+2))
        throw Error('Canvas wider than workspace at '+width+'px');
    }
    frame.style.width='900px';
    // Accessibility: collapsed ink settings must remain reachable and keyboard-operable.
    const inkDetails=[...d.querySelectorAll('#inks details.ink')];
    if(inkDetails.length!==2||inkDetails[0].open!==true||inkDetails[1].open!==false)
      throw Error('Ink controls not progressively disclosed');
    if(!d.querySelector('#screen-settings>summary')||!d.querySelector('#screen-settings').contains(el('screen-mode')))
      throw Error('Advanced screening settings missing');
    el('style').value='editorial-halftone';el('style').dispatchEvent(new Event('change',{bubbles:true}));
    el('style-dpi').value='600';el('style-lpi').value='50';
    el('style-variant').value='warm-third';el('style-variant').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>canvases().length===5,'three-ink style applied');
    if(Number(el('screen-pitch').value)!==12)throw Error('Physical LPI did not resolve at 600 DPI');
    if(!el('style-note').textContent.includes('Suitable:'))throw Error('Style suitability guidance missing');
    el('style-variant').value='tonal-key';el('style-variant').dispatchEvent(new Event('change',{bubbles:true}));
    await until(()=>canvases().length===4,'two-ink style applied');
    if(el('error').hidden!==true)throw Error('Style application failed: '+el('error').textContent);
    for(const [family,variant,count] of [['portrait-duotone','blue-pink',4],['portrait-duotone','teal-orange',4],['bold-spot-poster','process-cmy',5],['bold-spot-poster','process-cmyk',6],['editorial-halftone','forest-depth',4],['editorial-halftone','coast-duotone',4]]){
      el('style').value=family;el('style').dispatchEvent(new Event('change',{bubbles:true}));
      el('style-variant').value=variant;el('style-variant').dispatchEvent(new Event('change',{bubbles:true}));
      await until(()=>canvases().length===count,variant+' applied');
      if(el('style-variant').value!==variant||el('style-variant').disabled)throw Error('Missing shared variant '+variant);
      if(!el('style-note').textContent.includes('Suitable:'))throw Error('Missing variant guidance');
      const recipe=frame.contentWindow.StipraStyles.resolve(family,{variant,dpi:600,lpi:50});
      for(const ink of recipe.inkRecipe.inks){
        await adjustFromPlate(ink.id);
        const selector=el('control-'+ink.id+'-Source');
        if(!selector||selector.value!==ink.source)throw Error('New channel not editable '+ink.id);
        for(const [name,key] of [['Gamma','gamma'],['Strength','gain'],['Threshold','threshold']])if(Math.abs(Number(el('control-'+ink.id+'-'+name).value)-ink[key])>.00001)throw Error('Displayed setting differs from recipe '+ink.id+'/'+key);
      }
    }
    // Export through the real UI; inspect the downloaded ZIP rather than just its button.
    let exportedBlob;
    const win=frame.contentWindow,createURL=win.URL.createObjectURL.bind(win.URL),click=win.HTMLAnchorElement.prototype.click;
    win.URL.createObjectURL=blob=>{if(blob.type==='application/zip')exportedBlob=blob;return createURL(blob);};
    win.HTMLAnchorElement.prototype.click=function(){if(this.download==='stipra-print-package.zip')return;return click.call(this);};
    el('screen-blue-x').value='2';el('screen-blue-x').dispatchEvent(new Event('change',{bubbles:true}));
    el('marks-mm').value='2';el('marks-mm').dispatchEvent(new Event('change'));
    el('mute-blue').checked=true;el('mute-blue').dispatchEvent(new Event('change'));
    await delay(10);el('save-plates').click();
    await until(()=>exportedBlob||!el('error').hidden,'browser print package');
    if(!exportedBlob)throw Error('Export failed: '+el('error').textContent);
    const zip=await JSZip.loadAsync(await exportedBlob.arrayBuffer());
    const manifest=JSON.parse(await zip.file('manifest.json').async('string'));
    if(manifest.output.marksMm!==2||manifest.inks.length!==2||!manifest.inks.every(i=>i.marked&&zip.file(i.marked)))throw Error('Inspection mute or mark geometry changed export incorrectly');
    if(manifest.source.colorManagement.policy!=='stipra-srgb-v1')throw Error('Missing browser color policy');
    if(!(await zip.file(manifest.report.fontLicense).async('string')).includes('SIL OPEN FONT LICENSE'))throw Error('Missing embedded font license');
    if(manifest.contract!=='stipra-print-package-v1'||manifest.output.sourcePixels.width!==48||manifest.output.sourcePixels.height!==32)throw Error('Browser package geometry/contract differs');
    const source=await zip.file('source/original.png').async('uint8array');
    if(source.length!==(await screeningBlob.arrayBuffer()).byteLength)throw Error('Original source missing');
    const inkRecipe=JSON.parse(await zip.file('recipe/inks.json').async('string')),screens=JSON.parse(await zip.file('recipe/screens.json').async('string')),proofScreens=JSON.parse(await zip.file('recipe/proof-screens.json').async('string'));
    if(screens.plates.blue.registration.x!==0||proofScreens.plates.blue.registration.x!==2)throw Error('Proof offsets leaked into masters');
    const expected=win.StipraScreen.apply(win.StipraSeparation.separate({width:48,height:32,rgba:new win.Uint8ClampedArray(painter.getImageData(0,0,48,32).data)},inkRecipe),screens);
    async function decoded(bytes){const image=new Image(),url=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url;});URL.revokeObjectURL(url);const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const x=c.getContext('2d');x.drawImage(image,0,0);return x.getImageData(0,0,c.width,c.height).data;}
    for(const [i,ink] of manifest.inks.entries()){
      const bytes=await zip.file(ink.screened).async('uint8array'),pixels=await decoded(bytes),wanted=win.StipraSeparation.plateRGBA(expected.masks[i].coverage);
      if(!pixels.every((v,index)=>v===wanted[index]))throw Error('Exported master pixels differ from shared engine');
      const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);let count=0;
      for(let at=8;at<bytes.length;at+=12+view.getUint32(at)){if(String.fromCharCode(...bytes.slice(at+4,at+8))==='pHYs'){count++;if(view.getUint32(at+8)!==Math.round(600*1000/25.4))throw Error('Wrong export DPI');}}
      if(count!==1)throw Error('PNG physical density missing or duplicated');
    }
    for(const file of manifest.files){const bytes=await zip.file(file.path).async('uint8array');const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hash!==file.sha256)throw Error('Package hash mismatch '+file.path);}
    const pdf=await PDFLib.PDFDocument.load(await zip.file('report/separation-sheet.pdf').async('uint8array'));
    if(pdf.getPageCount()<2||!zip.file('report/separation-sheet.html'))throw Error('Inspection reports missing');
    if(!pdf.catalog.has(PDFLib.PDFName.of('Names')))throw Error('PDF recipe attachments missing');
    win.URL.createObjectURL=createURL;win.HTMLAnchorElement.prototype.click=click;
    const guideFrame=document.createElement('iframe');guideFrame.src='/dist/stipra/guide/index.html';guideFrame.style.height='844px';document.body.appendChild(guideFrame);
    await until(()=>guideFrame.contentDocument?.title==='stiprā / from image to ink','built public guide loaded');
    await guideFrame.contentDocument.fonts.ready;
    for(const width of [390,768,1280]){
      guideFrame.style.width=width+'px';await delay(80);
      const gd=guideFrame.contentDocument;
      if(gd.documentElement.scrollWidth>gd.documentElement.clientWidth+2)throw Error('Guide horizontal overflow at '+width+'px');
      if(!gd.querySelector('a[href="../"]'))throw Error('Guide studio navigation missing');
    }
    if(!d.querySelector('meta[http-equiv="Content-Security-Policy"]').content.includes("connect-src 'none'"))throw Error('Local processing CSP missing');
    for(const route of ['roadmap','changelog','delivery','sitemap']){
      const info=document.createElement('iframe');info.src='/dist/stipra/'+route+'/index.html';document.body.append(info);
      await until(()=>info.contentDocument?.title==='stiprā / '+({roadmap:'Roadmap',changelog:'Changelog',delivery:'Delivery map',sitemap:'Site map'}[route]),route+' loaded');
      await info.contentDocument.fonts.ready;
      for(const width of [390,768,1280]){
        info.style.width=width+'px';await delay(80);const idoc=info.contentDocument;
        if(idoc.documentElement.scrollWidth>idoc.documentElement.clientWidth+2)throw Error(route+' horizontal overflow at '+width+' / '+JSON.stringify([...idoc.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>idoc.documentElement.clientWidth+2).slice(0,4).map(e=>({tag:e.tagName,text:e.textContent.slice(0,70),right:e.getBoundingClientRect().right}))));
        const destinations=[...idoc.querySelectorAll('nav.site-nav a')].map(a=>new URL(a.href).pathname);
        for(const required of ['','guide/','roadmap/','changelog/','sketches/','regions/','delivery/','sitemap/']){
          const target=new URL('../'+required,info.src).pathname;
          if(!destinations.includes(target))throw Error('Missing shared destination '+target);
        }
      }
      info.remove();
    }
    document.body.dataset.smoke='pass';output.textContent='BROWSER_SEPARATION_PASS';
  }catch(error){
    document.body.dataset.smoke='fail';
    output.textContent='BROWSER_SEPARATION_FAIL: '+error.message+' | status='+(d?.getElementById('status')?.textContent||'no studio')+' | error='+(d?.getElementById('error')?.textContent||'none');
  }
})().catch(e=>{document.body.dataset.smoke='fail';document.getElementById('out').textContent='BROWSER_SEPARATION_FAIL: '+e.message;});
</script></body></html>
